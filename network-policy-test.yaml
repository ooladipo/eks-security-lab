apiVersion: v1
kind: Namespace
metadata:
  name: network-policy-lab
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: server
  namespace: network-policy-lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: server
  template:
    metadata:
      labels:
        app: server
    spec:
      containers:
        - name: server
          image: nginx:alpine
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: server
  namespace: network-policy-lab
spec:
  selector:
    app: server
  ports:
    - port: 80
      targetPort: 80